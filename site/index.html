<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Training Program Library | Axios Fitness Coaching</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: a gym-board index of programs; each program opens as a full-width sheet of day tables */
:root{
  --bg:#DAD7D2; --surface:#E6E3DE; --stone:#CBC6BE; --line:#ADA79C; --line-soft:#CBC6BE;
  --fg:#151414; --muted:#3B3836; --faint:#55504C;
  --plate:#F91C1C; --plate-soft:#F2CFCB; --plate-ink:#A31111; --on-plate:#151414;
  --steel:#151414; --steel-soft:#CBC6BE; --band:#151414; --on-band:#DAD7D2; --band-muted:#ADA79C;
  --display:"Inter Tight","Helvetica Neue",Arial,sans-serif;
  --body:"Inter Tight","Helvetica Neue",Arial,sans-serif;
  --mono:"Inter Tight","Helvetica Neue",Arial,sans-serif;
  --r:15px; --r-lg:20px;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5}
.wrap{max-width:1080px;margin:0 auto;padding-block:28px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--display);font-weight:700;letter-spacing:.01em;text-wrap:balance;margin:0;line-height:1.05}
h1{font-size:clamp(2.2rem,6vw,3.4rem);text-transform:uppercase}
h2{font-size:1.7rem;text-transform:uppercase}
h3{font-size:1.25rem;text-transform:uppercase;letter-spacing:.03em}
.eyebrow{font-family:var(--mono);font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;color:var(--plate-ink)}
.lede{color:var(--muted);max-width:62ch;margin:.6rem 0 0}
header.top{display:flex;flex-direction:column;gap:6px;margin-bottom:22px}
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:16px}
.controls input{flex:1 1 220px;min-width:0;font:inherit;padding:9px 12px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--fg)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:500 .8rem var(--body);padding:6px 11px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--muted);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--fg);border-color:var(--fg);color:var(--bg)}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--plate);outline-offset:2px}
.count{font-family:var(--mono);font-size:.78rem;color:var(--faint);margin-bottom:8px}
.shelf-nav{display:flex;flex-wrap:wrap;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line)}
.shelf-nav a{display:inline-flex;align-items:center;gap:8px;min-height:36px;padding:0 14px;border:1px solid var(--line);border-radius:999px;color:var(--fg);text-decoration:none;font:600 .85rem var(--body)}
.shelf-nav a span{font-family:var(--mono);font-size:.75rem;color:var(--muted)}
.shelf-nav a:hover{border-color:var(--fg)}
.shelf-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:22px 16px 10px;background:var(--bg);border-top:1px solid var(--line);scroll-margin-top:12px}
.shelf-head h2{font-family:var(--display);font-weight:700;font-size:1.6rem;text-transform:uppercase;letter-spacing:.02em;margin:0;line-height:1}
.shelf-head p{margin:4px 0 0;color:var(--muted);font-size:.92em}
.shelf-n{font-family:var(--mono);font-size:.78rem;color:var(--faint);white-space:nowrap}
details.shelf{border-top:1px solid var(--line)}
details.shelf>summary{list-style:none;cursor:pointer;border-top:0}
details.shelf>summary::-webkit-details-marker{display:none}
details.shelf>summary:hover h2{text-decoration:underline;text-underline-offset:4px}
details.shelf>summary:focus-visible{outline:2px solid var(--steel);outline-offset:-2px}
details.shelf[open]>summary{border-bottom:1px solid var(--line-soft)}
.shelf-n{display:inline-flex;align-items:center;gap:10px}
.shelf-n b{color:var(--fg);font-weight:600}
.shelf-n .tog::before{content:"+";display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border:1px solid var(--line);border-radius:50%;font:500 1rem var(--body);font-style:normal;color:var(--fg)}
details.shelf[open] .shelf-n .tog::before{content:"−"}
details.shelf>summary.shelf-head{align-items:center;padding:18px 16px}
.shelf-nav a.nav-extra{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.shelf-nav a.nav-extra:hover{opacity:.9}
.extra-row .sub{font-family:var(--mono);font-size:.78rem;color:var(--muted);margin:2px 0 4px}
.tag.soon-tag{background:transparent;border:1px dashed var(--line);color:var(--muted)}
.demo-btn{display:inline-flex;align-items:center;min-height:44px;padding:0 16px;border-radius:6px;border:1px solid var(--steel);color:var(--steel);background:var(--surface);font:600 .9rem var(--body);text-decoration:none;white-space:nowrap}
.demo-btn:hover{background:var(--steel);color:var(--surface)}
.row.demo-row{background:var(--steel-soft)}
.tag.free{background:var(--steel);color:var(--surface);border-color:var(--steel)}
.list{background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;padding:13px 16px;border-top:1px solid var(--line-soft);position:relative}
.row .main{text-decoration:none;color:inherit;min-width:0}
.row .main::after{content:"";position:absolute;inset:0}
.acts{display:flex;align-items:center;gap:14px;position:relative;z-index:1}
.acts .status{text-decoration:none}
.buy-sm{font:600 .78rem var(--body);padding:7px 12px;border-radius:6px;background:var(--plate);color:#fff;text-decoration:none;white-space:nowrap;border:1px solid var(--plate)}
.buy-sm:hover{filter:brightness(1.08)}
.buy-sm.nolink,.buy.nolink{background:transparent;color:var(--faint);border:1px dashed var(--line);cursor:default;filter:none}
.tag.lvl{background:transparent;border:1px solid var(--line);color:var(--fg)}
.tag.lvl-Beginner{border-color:#3f8f5a;color:#3f8f5a}
.tag.lvl-Intermediate{border-color:#b7862b;color:#b7862b}
.tag.lvl-Advanced{border-color:#b8443a;color:#b8443a}
.tag.rated{background:var(--plate);color:#fff}
.copy{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--plate);border-radius:8px;padding:16px 18px;margin:0 0 22px;max-width:80ch}
.copy h2{font-family:var(--display);font-size:1.1rem;text-transform:uppercase;letter-spacing:.04em;margin:0 0 8px}
.copy p{margin:0 0 10px;color:var(--muted);line-height:1.55}
.copy p:last-child{margin-bottom:0}
.incl{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--steel);border-radius:8px;padding:16px 18px;margin:4px 0 0;max-width:80ch;width:100%;box-sizing:border-box}
.incl .note:last-child{margin-bottom:0}
.incl h2{font-family:var(--display);font-size:1.1rem;text-transform:uppercase;letter-spacing:.04em;margin:0;display:inline}
.incl summary{cursor:pointer;list-style:none;display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px;margin:-6px 0}
.incl summary::-webkit-details-marker{display:none}
.incl summary::after{content:"Show";font-family:var(--mono);font-size:.75rem;letter-spacing:.1em;text-transform:uppercase;color:var(--steel);flex:none}
.incl[open] summary::after{content:"Hide"}
.incl[open] summary{margin-bottom:8px}
.incl summary:focus-visible{outline:2px solid var(--steel);outline-offset:4px;border-radius:4px}
.incl .lead{margin:0 0 14px;color:var(--fg);line-height:1.55}
.incl .items{display:grid;gap:14px;margin:0 0 14px}
.incl h3{font-size:.95rem;font-weight:600;margin:0 0 4px}
.incl .item p{margin:0 0 4px;color:var(--muted);line-height:1.55}
.incl .note{margin:0 0 14px;color:var(--muted);font-size:.92em}
.row:first-child{border-top:0}
.row:hover{background:var(--steel-soft)}
.row .name{font-family:var(--display);font-weight:600;font-size:1.3rem;letter-spacing:.02em;text-transform:uppercase}
.row .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:3px}
.tag{font:500 .72rem var(--mono);letter-spacing:.04em;padding:2px 7px;border-radius:4px;background:var(--steel-soft);color:var(--steel);white-space:nowrap}
.status{font:500 .74rem var(--mono);letter-spacing:.05em;text-transform:uppercase;white-space:nowrap}
.status.ready{color:var(--plate-ink)}
.status.ready::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--plate);margin-right:6px;vertical-align:1px}
.status.soon{color:var(--faint)}
.equip{background:var(--surface);border:1px solid var(--line);border-radius:8px;margin-bottom:14px}
.equip summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:10px 14px;font:600 .82rem var(--mono);letter-spacing:.08em;text-transform:uppercase}
.equip summary::-webkit-details-marker{display:none}
.equip summary::before{content:"";width:7px;height:7px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(-45deg);transition:transform .15s;margin-right:2px}
.equip[open] summary::before{transform:rotate(45deg)}
.equip .sel{font:500 .74rem var(--mono);letter-spacing:.04em;text-transform:none;color:var(--plate-ink)}
.equip .clear-link{margin-left:auto;font:500 .74rem var(--body);letter-spacing:0;text-transform:none;color:var(--steel);background:none;border:0;padding:0;cursor:pointer}
.equip-body{padding:2px 14px 14px;display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line-soft)}
.equip-body p{margin:8px 0 0;color:var(--muted);font-size:.85rem;max-width:70ch}
.equip-actions{display:flex;gap:14px}
.equip-actions button{font:500 .8rem var(--body);background:none;border:0;padding:0;color:var(--steel);cursor:pointer}
.equip-actions button:hover,.equip .clear-link:hover{text-decoration:underline}
.goal-def{font-size:.82rem!important}
.goal-def:empty{display:none}
.goal-def b{color:var(--fg);font-weight:600}
.understood{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:-6px 0 14px}
.understood:empty{display:none}
.understood .lbl{font:500 .72rem var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--faint);margin-right:2px}
.understood .k{color:var(--faint);margin-right:2px}
.understood .hint{font-size:.82rem;color:var(--muted)}
.tag.seq{background:var(--fg);color:var(--bg);letter-spacing:.08em}
.gear .legend{font-size:.8rem;color:var(--muted);margin-left:4px}
.tag.also{background:var(--plate-soft);color:var(--plate-ink)}
.gear{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.gear .lbl{font:500 .72rem var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--faint);margin-right:2px}
.empty{padding:28px 16px;color:var(--muted)}
.back{display:inline-flex;gap:6px;align-items:center;font:500 .85rem var(--body);color:var(--steel);text-decoration:none;margin-bottom:18px}
.back:hover{text-decoration:underline}
.sheet-head{display:flex;flex-direction:column;gap:8px;padding-bottom:18px;border-bottom:3px solid var(--fg);margin-bottom:20px}
.facts{display:flex;flex-wrap:wrap;gap:8px 18px;font-family:var(--mono);font-size:.82rem;color:var(--muted)}
.facts b{color:var(--fg);font-weight:500}
.notes{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px;color:var(--muted);font-size:.88rem;max-width:80ch}
.notes li::before{content:"— ";color:var(--faint)}
section.block{margin-top:30px}
section.block>h2{margin-bottom:10px}
section.block>h2 small,.wk>summary h2 small{font-family:var(--mono);font-size:.8rem;font-weight:400;letter-spacing:.04em;color:var(--muted);text-transform:none;margin-left:8px}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:640px;font-size:.88rem}
th,td{text-align:left;vertical-align:top;padding:7px 10px;border-top:1px solid var(--line-soft)}
thead th{font:600 .72rem var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);background:var(--bg);border-top:0}
tr.day-start td{border-top:2px solid var(--line)}
td.day{font-family:var(--display);font-weight:600;font-size:1.05rem;text-transform:uppercase;letter-spacing:.02em;white-space:nowrap;width:1%}
td.day span{display:block;font-family:var(--mono);font-size:.7rem;font-weight:400;color:var(--faint);letter-spacing:.06em}
td.slot{font-family:var(--mono);color:var(--faint);width:1%;white-space:nowrap}
tr.pair-a td.slot,tr.solo td.slot{color:var(--plate-ink)}
td.rx{font-family:var(--mono);font-size:.82rem;font-variant-numeric:tabular-nums}
td.cond{font-family:var(--mono);font-size:.8rem;color:var(--steel);max-width:22ch}
.star{color:var(--plate);font-weight:700;margin-left:2px}
tr.cardio td{background:var(--steel-soft)}
.prog table{min-width:720px}
.prog td:first-child{font-weight:600;white-space:nowrap}
.prog td:not(:first-child){font-family:var(--mono);font-size:.8rem;font-variant-numeric:tabular-nums}
.buy{align-self:flex-start;display:inline-flex;align-items:center;gap:6px;margin-top:4px;padding:10px 16px;border-radius:6px;background:var(--plate);color:#fff;font:600 .9rem var(--body);text-decoration:none;border:1px solid var(--plate)}
.buy:hover{filter:brightness(1.08)}
.about{max-width:68ch;margin:2px 0 4px}
.about p{margin:0 0 8px;line-height:1.55;color:var(--fg)}
.about p:last-child{margin-bottom:0;color:var(--muted)}
.gear .plain{font-size:.88rem;color:var(--muted)}
.progwrap{margin-top:30px;border-top:1px solid var(--line);padding-top:6px}
.progwrap>summary{cursor:pointer;font-family:var(--display);font-weight:700;font-size:1.25rem;text-transform:uppercase;min-height:44px;display:flex;align-items:center;gap:10px}
.progwrap>summary::after{content:"Show";font:500 .75rem var(--mono);letter-spacing:.1em;color:var(--steel)}
.progwrap[open]>summary::after{content:"Hide"}
.progwrap section.block:first-of-type{margin-top:10px}
.wk>summary{cursor:pointer;list-style:none;display:flex;flex-direction:column;gap:8px}
.wk>summary::-webkit-details-marker{display:none}
.wk>summary h2{margin:0}
.wk .seq{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.wk .seq li{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 10px;font-family:var(--display);font-weight:600;font-size:.9rem;text-transform:uppercase;letter-spacing:.02em}
.wk .seq li span{display:block;font:400 .66rem var(--mono);color:var(--faint);letter-spacing:.06em}
.wk[open] .seq{display:none}
.wk .wk-tog::before{content:"+ Show exercises, sets & reps";font:500 .75rem var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--steel)}
.wk[open] .wk-tog::before{content:"− Hide exercises, sets & reps"}
.wk[open]>summary{margin-bottom:10px}
.wk>summary:focus-visible{outline:2px solid var(--steel);outline-offset:4px;border-radius:4px}
.howto summary{list-style:none}
.howto summary::-webkit-details-marker{display:none}
.howto summary::before{content:"+";display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;margin-right:8px;border:1px solid currentColor;border-radius:50%;font-size:.85rem;line-height:1}
.howto[open] summary::before{content:"−"}
.brand{display:inline-flex;align-items:center;gap:8px;font-family:var(--mono);font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;color:var(--plate-ink)}
.brand img{width:24px;height:24px;border-radius:5px;flex:none}
.builtfor{margin:0 0 4px;max-width:68ch;line-height:1.55;color:var(--muted)}
.builtfor b{font-weight:600;color:var(--fg)}
.gear .plain.prim{color:var(--fg);font-weight:600}
.struct{margin:8px 0 10px}
.struct-note{margin:10px 0 0;max-width:68ch;font-size:.9rem;line-height:1.55;color:var(--muted)}
.struct-note b{color:var(--fg);font-weight:600}
.struct-row{display:flex;flex-wrap:wrap;gap:6px}
.wkc{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 10px;display:flex;flex-direction:column;gap:1px;min-width:92px}
.wkc .n{font:400 .66rem var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--faint)}
.wkc b{font-size:.85rem;font-weight:600}
.wkc .r{font:500 .7rem var(--mono);color:var(--steel)}
.wkc.b-A{border-top:3px solid var(--steel)}.wkc.b-B{border-top:3px solid var(--plate)}.wkc.b-C{border-top:3px solid var(--fg)}.wkc.b-U{border-top:3px solid var(--line)}
em.tm{display:block;font:400 .68rem var(--mono);font-style:normal;color:var(--faint);letter-spacing:.04em;text-transform:none;margin-top:2px}
.up-col>summary{cursor:pointer;list-style:none;display:flex;flex-direction:column;gap:4px;min-height:44px;justify-content:center}
.up-col>summary::-webkit-details-marker{display:none}
.up-col .teaser{font-family:var(--display);font-weight:700;font-size:1.35rem;text-transform:uppercase;letter-spacing:.01em;display:flex;align-items:center;justify-content:space-between;gap:12px}
.up-col .teaser::after{content:"+ Learn more";font:500 .75rem var(--mono);letter-spacing:.1em;opacity:.75;flex:none}
.up-col[open] .teaser::after{content:"− Hide"}
.up-col[open]>summary{margin-bottom:4px}
.up-col[open] .teaser .t{visibility:hidden}
.up-col[open] .teaser{margin-bottom:-28px}
.up-col>summary:focus-visible{outline:2px solid var(--bg);outline-offset:4px;border-radius:4px}
.howto{margin:0 0 6px;max-width:80ch}
.howto summary{cursor:pointer;font:500 .78rem var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--steel);min-height:32px;display:inline-flex;align-items:center}
.howto .notes{margin-top:6px}
.nocond table{min-width:520px}
.foot{margin-top:28px;font-size:.82rem;color:var(--faint);max-width:80ch}
.upgrade{margin:36px 0 0;padding:22px 22px 24px;background:var(--fg);color:var(--bg);border-radius:10px;max-width:80ch}
.upgrade .eyebrow{color:inherit;opacity:.7}
.upgrade h2{font-family:var(--display);font-weight:700;font-size:1.9rem;line-height:1.05;text-transform:uppercase;letter-spacing:.01em;margin:6px 0 10px}
.upgrade .lead{margin:0 0 18px;line-height:1.55;opacity:.85;max-width:62ch}
.upgrade .pts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin:0 0 20px}
.upgrade h3{font-size:.95rem;font-weight:600;margin:0 0 4px}
.upgrade .pts p{margin:0;line-height:1.5;opacity:.75;font-size:.95em}
.upgrade .cta{display:flex;flex-wrap:wrap;align-items:center;gap:12px 18px}
.upgrade .price{font-family:var(--mono);font-size:.9rem;letter-spacing:.04em}
.upgrade .go{display:inline-flex;align-items:center;min-height:44px;padding:0 18px;border-radius:6px;background:var(--plate);color:#fff;font:600 .95rem var(--body);text-decoration:none}
.upgrade .go:hover{filter:brightness(1.08)}
.upgrade.club{max-width:none;margin:40px 0 8px}
.upgrade .go.nolink{opacity:.55;cursor:default}
.pending{background:var(--surface);border:1px dashed var(--line);border-radius:8px;padding:22px 18px;color:var(--muted);max-width:60ch}
.pending a{color:var(--steel)}
.buy.nolink{background:var(--surface);color:var(--muted);border:1px dashed var(--line);cursor:default}
@media (max-width:560px){.row{grid-template-columns:minmax(0,1fr)}.acts{justify-self:start}details.shelf>summary.shelf-head{flex-direction:column;align-items:flex-start;gap:10px}.demo-row .tag{white-space:normal}}
@media (prefers-reduced-motion:no-preference){.row{transition:background .12s}}

/* ===== Concept A (axioscoaching.com look): bone ground, stone cards, ink type, signal-red buttons ===== */
body{margin:0;font-size:16px;overflow-x:clip}
.wrap{max-width:1168px;padding-block:0 0}
h1,h2,h3{font-weight:800;letter-spacing:-.02em;line-height:.95}
h1{font-size:clamp(2.8rem,7vw,5.5rem)}
h2{font-size:clamp(1.6rem,3vw,2.4rem)}
.eyebrow,.brand{font:600 .8rem var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
a{color:inherit}
.tag{font:600 .78rem var(--body);letter-spacing:0;padding:4px 10px;border-radius:8px;background:var(--stone);color:var(--fg)}
.tag.seq{background:var(--fg);color:var(--bg);letter-spacing:.04em}
.tag.lvl{background:transparent;border:1px solid currentColor}
.tag.lvl-Beginner{color:#2E6B43;border-color:#2E6B43}.tag.lvl-Intermediate{color:#7A5410;border-color:#7A5410}.tag.lvl-Advanced{color:#9C2F26;border-color:#9C2F26}
.tag.rated{background:var(--plate);color:var(--on-plate)}
.tag.soon-tag{background:transparent;border:1px dashed var(--line);color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 22px;border-radius:var(--r);font:700 .95rem var(--body);text-decoration:none;border:0;cursor:pointer;white-space:nowrap}
.btn.red,.buy,.buy-sm,.upgrade .go{background:var(--plate);color:var(--on-plate);border:0;border-radius:var(--r)}
.btn.ink{background:var(--fg);color:var(--bg)}
.btn.ghost{background:transparent;color:var(--fg);border:2px solid var(--fg)}
.buy{min-height:52px;padding:0 26px;font:700 1rem var(--body);justify-content:center;margin:0}
.buy-sm{display:inline-flex;align-items:center;min-height:44px;padding:0 18px;font:700 .88rem var(--body)}
.buy.nolink,.buy-sm.nolink{background:transparent;color:var(--muted);border:1px dashed var(--line)}
.btn:hover,.buy:hover,.buy-sm:hover{filter:brightness(1.06)}
button:focus-visible,a:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--fg);outline-offset:3px}

/* site nav */
.site-nav{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:14px 24px;padding:22px 0}
.site-nav .logo{display:inline-flex;align-items:center;gap:10px;font:800 1.25rem var(--body);letter-spacing:.02em;text-decoration:none;color:var(--fg)}
.site-nav .logo img{width:32px;height:32px;border-radius:7px}
.site-nav nav{display:flex;flex-wrap:wrap;gap:6px 26px;font:500 .9rem var(--body)}
.site-nav nav a{text-decoration:none;min-height:32px;display:inline-flex;align-items:center}
.site-nav nav a:hover{text-decoration:underline;text-underline-offset:4px}

/* library hero */
.hero{display:flex;flex-direction:column;align-items:center;text-align:center;gap:18px;padding:56px 0 28px}
.hero h1{text-transform:uppercase}
.hero .lede{font-size:1.1rem;color:var(--muted);max-width:56ch;margin:0}
.hero .search{display:flex;flex-wrap:wrap;gap:10px;width:100%;max-width:640px;margin-top:6px}
.hero .search input{flex:1 1 300px;min-width:0;min-height:52px;padding:0 18px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);color:var(--fg);font:500 1rem var(--body)}
.filters{display:flex;flex-direction:column;gap:10px;max-width:880px;margin:0 auto 14px}
.filters .chips{justify-content:center}
.chip{font:600 .85rem var(--body);min-height:38px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--fg)}
.chip[aria-pressed="true"]{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.equip{background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r);margin:0}
.equip summary{font:700 .82rem var(--body);letter-spacing:.1em;padding:12px 16px}
.equip .sel{font:600 .8rem var(--body);color:var(--plate-ink)}
.equip .clear-link,.equip-actions button{color:var(--fg);text-decoration:underline}
.understood{justify-content:center;margin:0 0 8px}
.understood .lbl,.understood .k{font:600 .75rem var(--body)}
.count{font:500 .85rem var(--body);color:var(--faint);text-align:center;margin:0 0 22px}

/* free banner */
.free-banner{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px;padding:22px 26px;border-radius:var(--r-lg);background:var(--stone);margin:0 0 36px}
.free-banner .t{display:flex;flex-direction:column;gap:6px}
.free-banner .pill{align-self:flex-start;padding:3px 10px;border-radius:6px;background:var(--plate);color:var(--on-plate);font:600 .8rem var(--body)}
.free-banner b{font:800 1.35rem var(--body);text-transform:uppercase;letter-spacing:-.01em}
.free-banner span.s{color:var(--muted)}

/* tiles */
.sec-title{font:700 .85rem var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--faint);margin:0 0 14px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.tile{display:flex;flex-direction:column;gap:10px;min-height:190px;padding:24px;border-radius:var(--r-lg);background:var(--stone);color:var(--fg);border:0;text-align:left;font:inherit;cursor:pointer;text-decoration:none}
.tile .num{font:600 .8rem var(--body);letter-spacing:.12em;color:var(--faint)}
.tile .ttl{font:800 2.1rem var(--body);text-transform:uppercase;line-height:1;letter-spacing:-.02em}
.tile .dsc{font-size:.95rem;line-height:1.45;color:var(--muted)}
.tile .foot2{margin-top:auto;display:flex;justify-content:space-between;align-items:center;font:600 .9rem var(--body)}
.tile .pm{font-size:1.5rem;line-height:1}
.tile[aria-expanded="true"]{background:var(--fg);color:var(--bg)}
.tile[aria-expanded="true"] .num,.tile[aria-expanded="true"] .dsc{color:var(--line)}
.tile[aria-expanded="true"] .pm{color:var(--plate)}
.tile:hover{filter:brightness(.97)}
.tiles.centered .tile{align-items:center;text-align:center;min-height:0;padding:34px 26px}
.tiles.centered .tile .pill{padding:3px 10px;border-radius:6px;background:var(--plate);color:var(--on-plate);font:600 .8rem var(--body)}
.tiles.centered .tile .foot2{margin-top:6px;gap:10px}
.panel{margin:14px 0 0;border-radius:var(--r-lg);background:var(--surface);overflow:hidden}
.panel-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;padding:18px 24px;border-bottom:1px solid var(--stone)}
.panel-head b{font:800 1.25rem var(--body);text-transform:uppercase}
.panel-head span{font:500 .9rem var(--body);color:var(--muted)}
.group-head{padding:14px 24px 6px;font:700 .8rem var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--faint);border-top:1px solid var(--stone)}
.lib-sec{margin:0 0 40px;scroll-margin-top:16px}
.list{background:transparent;border:0;border-radius:0}
.row{grid-template-columns:minmax(0,1fr) auto;gap:14px;padding:20px 24px;border-top:1px solid var(--stone)}
.row:hover{background:var(--stone)}
.row .name{font:800 1.35rem var(--body);letter-spacing:-.01em;text-transform:uppercase}
.row .sum{margin:4px 0 0;color:var(--muted);font-size:.95rem;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;max-width:70ch}
.row .meta{gap:6px;margin-top:10px}
.acts{gap:16px}
.acts .see{font:600 .9rem var(--body);text-decoration:underline;text-underline-offset:4px;white-space:nowrap}
.extra-row .sub{font:500 .9rem var(--body);color:var(--muted);margin:4px 0 0}
.empty{padding:28px 24px}

/* full-bleed band */
.band{margin:56px calc(50% - 50vw) 0;background:var(--band);color:var(--on-band)}
.band-in{max-width:1168px;margin:0 auto;padding:64px max(16px,env(safe-area-inset-left,0px));display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:28px}
.band .l{display:flex;flex-direction:column;gap:12px;flex:1 1 520px}
.band .eb{font:600 .8rem var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--band-muted)}
.band h2{font-size:clamp(2.2rem,5vw,4rem);text-transform:uppercase;color:inherit}
.band p{margin:0;max-width:54ch;font-size:1.05rem;line-height:1.5;opacity:.85}
.band .r{display:flex;flex-direction:column;align-items:flex-start;gap:14px}
.band .price{font:800 2.6rem var(--body);line-height:1}
.band .price small{font:600 1.05rem var(--body);color:var(--band-muted)}
.band .go.nolink{opacity:.55;cursor:default}

/* system sales page (#system-<id>) */
.sys-about p+p{font-size:1rem;color:var(--muted)}
.sys-sec{margin:14px 0 0;padding:clamp(24px,4vw,44px);border-radius:var(--r-lg);background:var(--surface)}
.sys-sec>.eb,.sys-band .eb{display:block;font:600 .8rem var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--faint);margin:0 0 12px}
.sys-sec h2{font-size:clamp(1.8rem,4vw,3rem);text-transform:uppercase;max-width:20ch}
.sys-sec .txt{max-width:62ch;margin-top:16px}
.sys-sec .txt p{font-size:1.08rem;line-height:1.55;margin:0 0 12px;color:var(--fg)}
.sys-sec .txt p:last-child{margin-bottom:0}
.sys-band{margin:14px 0 0;padding:clamp(28px,5vw,56px);border-radius:var(--r-lg);background:var(--band);color:var(--on-band)}
.sys-band .eb{color:var(--band-muted)}
.sys-band h2{font-size:clamp(2rem,5vw,3.6rem);text-transform:uppercase;color:inherit;max-width:16ch}
.sys-band .txt{max-width:60ch;margin-top:18px}
.sys-band .txt p{font-size:1.1rem;line-height:1.55;margin:0 0 12px;opacity:.9}
.sys-week{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;margin-top:22px}
.sys-week li{list-style:none;display:flex;flex-direction:column;gap:6px;padding:16px;border-radius:var(--r);background:var(--stone);min-width:0}
.sys-week li.cond{background:transparent;border:1px dashed var(--line)}
.sys-week .d{font:600 .72rem var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}
.sys-week b{font:800 clamp(.82rem,1.15vw,1.05rem) var(--body);text-transform:uppercase;line-height:1.05;letter-spacing:-.01em}
.sys-week span.w{font-size:.85rem;color:var(--muted);line-height:1.35}
.sys-week+.note{margin:16px 0 0;max-width:70ch;color:var(--muted)}
.sys-phases{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;margin-top:22px}
.sys-phase{display:flex;flex-direction:column;gap:12px;padding:24px;border-radius:var(--r-lg);background:var(--stone);text-decoration:none;color:var(--fg)}
.sys-phase .n{font:800 3.4rem var(--body);line-height:.85;letter-spacing:-.04em;color:var(--plate)}
.sys-phase .lbl{font:600 .78rem var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}
.sys-phase h3{font:800 1.5rem var(--body);text-transform:uppercase;letter-spacing:-.01em;line-height:1}
.sys-phase p{margin:0;color:var(--muted);line-height:1.5}
.sys-phase .lifts{display:flex;flex-wrap:wrap;gap:6px}
.sys-phase .go{margin-top:auto;font:600 .9rem var(--body);text-decoration:underline;text-underline-offset:4px}
.sys-phase:hover{filter:brightness(.97)}
.sys-loop{display:flex;align-items:center;flex-wrap:wrap;gap:10px;margin-top:26px}
.sys-loop .st{padding:12px 18px;border-radius:var(--r);border:2px solid var(--on-band);font:800 1rem var(--body);text-transform:uppercase;white-space:nowrap}
.sys-loop .st.new{background:var(--plate);border-color:var(--plate);color:var(--on-plate)}
.sys-loop .ar{font:700 1.4rem var(--body);color:var(--plate)}
.sys-loop .ret{flex-basis:100%;font:600 .9rem var(--body);color:var(--band-muted)}
.sys-two{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px;margin-top:22px}
.sys-two>div{padding:24px;border-radius:var(--r-lg);background:var(--stone)}
.sys-two h3{font:800 1.15rem var(--body);text-transform:uppercase;margin:0 0 12px}
.sys-two ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}
.sys-two li{position:relative;padding-left:22px;line-height:1.45}
.sys-two li::before{content:"";position:absolute;left:0;top:.5em;width:10px;height:10px;border-radius:2px;background:var(--fg)}
.sys-two .chg li::before{background:var(--plate)}
.sys-inc{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px 28px;margin-top:22px}
.sys-inc div{border-top:2px solid var(--fg);padding-top:12px}
.sys-inc b{display:block;font:800 1rem var(--body);text-transform:uppercase;margin-bottom:4px}
.sys-inc p{margin:0;color:var(--muted);line-height:1.45}
.sys-faq{margin-top:18px;border-top:1px solid var(--line)}
.sys-faq details{border-bottom:1px solid var(--line)}
.sys-faq summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:16px;min-height:60px;font:700 1.05rem var(--body)}
.sys-faq summary::-webkit-details-marker{display:none}
.sys-faq summary::after{content:"+";font:600 1.5rem var(--body);flex:none}
.sys-faq details[open] summary::after{content:"−"}
.sys-faq p{margin:0 0 18px;max-width:64ch;color:var(--muted);line-height:1.55}
.sys-cta{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:20px;margin-top:26px}
.sys-cta .price{font:800 2.6rem var(--body);line-height:1}
.sys-cta .price small{font:600 1rem var(--body);color:var(--band-muted)}
.sys-cta .buy{min-width:240px}
.buycard .buy{white-space:nowrap}
@media (max-width:860px){.sys-week{grid-template-columns:repeat(3,minmax(0,1fr))}.sys-week b{font-size:1rem}}
@media (max-width:560px){.sys-week{grid-template-columns:repeat(2,minmax(0,1fr))}.sys-week b{font-size:.82rem}.sys-week li{padding:14px 12px}.sys-loop .st{padding:10px 12px;font-size:.9rem}.sys-cta .buy{min-width:0;width:100%}}
@media (max-width:420px){.sys-week{grid-template-columns:minmax(0,1fr);gap:6px}.sys-week li{flex-direction:row;flex-wrap:wrap;align-items:baseline;gap:2px 10px;padding:12px 14px}.sys-week b{font-size:1rem}.sys-week span.w{flex-basis:100%}}
/* program page */
.p-hero{display:flex;flex-wrap:wrap;gap:32px;align-items:flex-start;padding:20px 0 36px}
.p-main{flex:999 1 560px;min-width:0;display:flex;flex-direction:column;gap:18px}
.p-main .back{margin:0;color:var(--fg);font:600 .9rem var(--body)}
.p-main h1{text-transform:uppercase;letter-spacing:-.03em;line-height:.88;font-size:clamp(2.8rem,8vw,6.5rem)}
.p-main h1.long{font-size:clamp(2.2rem,5.6vw,4.6rem)}
.p-main h1{overflow-wrap:break-word}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill-d{padding:4px 12px;border-radius:8px;background:var(--fg);color:var(--bg);font:700 .82rem var(--body)}
.pill-o{padding:4px 12px;border-radius:8px;border:1px solid var(--line);font:600 .82rem var(--body)}
.about{max-width:60ch;margin:0}
.about p{font-size:1.15rem;line-height:1.5;margin:0 0 10px}
.about p:last-child{font-size:1rem;color:var(--muted)}
.builtfor{max-width:60ch;font-size:1rem;color:var(--muted);margin:0}
.glines{display:flex;flex-direction:column;gap:10px;margin-top:4px}
.gline{display:grid;grid-template-columns:10.5em minmax(0,1fr);align-items:baseline;gap:6px 12px;color:var(--muted)}
.gline .gv{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.buycard .buy{align-self:stretch}
.gline .lbl{font:600 .75rem var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}
.gline .gp{padding:5px 12px;border-radius:999px;background:var(--fg);color:var(--bg);font:600 .9rem var(--body)}
.buycard{flex:1 1 300px;display:flex;flex-direction:column;gap:16px;padding:26px;border-radius:var(--r-lg);background:var(--stone)}
.buycard .pill{align-self:flex-start;padding:3px 10px;border-radius:6px;background:var(--plate);color:var(--on-plate);font:600 .8rem var(--body)}
.buycard .pill.soon{background:transparent;border:1px dashed var(--line);color:var(--muted)}
.buycard .price{font:800 2.8rem var(--body);line-height:1}
.buycard .price small{font:600 1rem var(--body);color:var(--faint)}
.buycard dl{display:flex;flex-direction:column;gap:8px;margin:0}
.buycard dl div{display:flex;justify-content:space-between;gap:12px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.buycard dl div:last-child{border-bottom:0;padding-bottom:0}
.buycard dt{color:var(--muted)}.buycard dd{margin:0;font-weight:700;text-align:right}
.buycard .incl{background:transparent;border:0;padding:0;margin:0;max-width:none}
.buycard .incl h2{font:600 .95rem var(--body);text-transform:none;letter-spacing:0}
.buycard .incl summary{min-height:44px;margin:0}
.buycard .incl summary::after{content:"+";font:600 1.4rem var(--body);letter-spacing:0;color:var(--fg)}
.buycard .incl[open] summary::after{content:"−"}
.buycard .incl .lead{font-size:.95rem}
.buycard .incl .items{gap:12px}
.buycard .incl h3{font:700 .9rem var(--body);text-transform:none;letter-spacing:0}
.buycard .incl .item p,.buycard .incl .note{font-size:.88rem}
.sheet-head{display:none}
.howto{max-width:none;margin:0 0 6px;border:1px solid var(--line);border-radius:var(--r);padding:0 22px}
.howto summary{min-height:56px;font:700 .88rem var(--body);letter-spacing:.1em;color:var(--fg)}
.howto summary::before{border:0;font-size:1.3rem;font-weight:600;width:auto;height:auto;margin-right:12px}
.howto[open]{padding-bottom:18px}
.notes{font-size:.95rem;color:var(--muted)}
.wkc{background:var(--stone);border:0;border-radius:12px;padding:10px 12px}
.wkc .n{font:600 .7rem var(--body);letter-spacing:.1em;color:var(--faint)}
.wkc b{font:800 .95rem var(--body)}
.wkc .r{font:600 .75rem var(--body);color:var(--muted)}
.wkc.b-A{border-top:3px solid var(--fg)}.wkc.b-B{border-top:3px solid var(--plate)}.wkc.b-C{border-top:3px solid var(--faint)}
.struct-note{font-size:.95rem}
section.block{margin-top:14px;padding:26px;border-radius:var(--r-lg);background:var(--surface)}
section.block>h2 small,.wk>summary h2 small{font:600 .9rem var(--body);letter-spacing:0;color:var(--faint);margin-left:12px}
.wk>summary h2{font-size:2.4rem;text-transform:uppercase}
.wk>summary{gap:16px}
.wk .seq{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.wk .seq li{display:flex;flex-direction:column;gap:6px;padding:16px;border-radius:var(--r);background:var(--stone);border:0;font:800 1.1rem var(--body);letter-spacing:0}
.wk .seq li span{font:600 .72rem var(--body);letter-spacing:.12em;color:var(--faint)}
.wk .seq li{overflow-wrap:break-word;hyphens:auto;min-width:0}
.wk .seq li.cardio{background:transparent;border:1px dashed var(--line)}
em.tm{font:500 .82rem var(--body);color:var(--muted);margin-top:0}
.wk .wk-tog{min-height:44px;display:inline-flex;align-items:center}
.wk .wk-tog::before{font:700 .8rem var(--body);letter-spacing:.1em;color:var(--fg);text-decoration:underline;text-decoration-color:var(--plate);text-decoration-thickness:2px;text-underline-offset:6px}
.tbl-wrap{border:0;border-radius:var(--r);background:var(--bg)}
table{font-size:.92rem}
th,td{border-top:1px solid var(--stone)}
thead th{font:700 .72rem var(--body);letter-spacing:.1em;background:var(--stone)}
tr.day-start td{border-top:2px solid var(--line)}
td.day{font:800 1rem var(--body)}
td.day span{font:600 .7rem var(--body);letter-spacing:.1em}
td.slot,td.rx,td.cond,.prog td:not(:first-child){font-family:var(--body);font-variant-numeric:tabular-nums}
td.slot{font-weight:700}
td.cond{color:var(--muted)}
tr.cardio td{background:var(--surface)}
.progwrap{margin-top:14px;border:1px solid var(--line);border-radius:var(--r-lg);padding:0 22px}
.progwrap>summary{font:800 1.3rem var(--body);min-height:64px;justify-content:space-between;list-style:none}
.progwrap>summary::-webkit-details-marker{display:none}
.progwrap>summary::after{content:"+";font:600 1.6rem var(--body);color:var(--fg);letter-spacing:0}
.progwrap[open]>summary::after{content:"−"}
.progwrap[open]{padding-bottom:22px}
.progwrap section.block{padding:0;background:transparent}
.progwrap section.block>h2{font-size:1.1rem;letter-spacing:.04em;margin:10px 0 10px}
.pending{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r-lg);padding:24px;color:var(--muted);max-width:none;margin-top:8px}
.pending a{color:var(--fg)}
.foot{color:var(--faint)}
@media (max-width:560px){.row{grid-template-columns:minmax(0,1fr)}.acts{justify-self:start}.gline{grid-template-columns:1fr}section.block{padding:18px}.wk .seq{grid-template-columns:repeat(2,minmax(0,1fr))}.wk>summary h2{font-size:2rem}.site-nav nav{gap:4px 18px}.hero{padding-top:32px}.free-banner{padding:20px}.band-in{padding-block:48px}}

/* embedded in another site */
html.embedded body{overflow:hidden}
html.embedded .site-nav{display:none}
html.embedded .hero{padding-top:24px}
html.embedded .band{margin-left:0;margin-right:0}
html.embedded .wrap{padding-bottom:clamp(64px,8vw,112px)}

function parseQuery(q){
  let t=" "+q.toLowerCase().replace(/[^\w\s/&-]/g," ")+" ";
  const out={goal:new Set(),equip:new Set(),days:new Set(),level:new Set(),unknown:[]};
  t=t.replace(/\b(\d|one|two|three|four|five|six|seven)\s*(?:x|-?\s*days?|times)(?:\s*(?:a|per|\/)\s*w(?:ee)?k)?\b/g,(m,n)=>{out.days.add(NUMW[n]||+n);return " "});
  for(const [k,v,re] of TERMS){const g=new RegExp(re.source,"g");if(g.test(t)){[].concat(v).forEach(x=>out[k].add(x));t=t.replace(new RegExp(re.source,"g")," ")}}
  out.unknown=t.split(/\s+/).filter(w=>w&&!STOP.has(w)&&!/^\d+$/.test(w));
  return out;
}

  const bi=blockInfo(p), seqW=(bi.seq||"").split("/").flatMap(g=>g==="U"?[g]:g.split("")).filter(x=>x&&x!=="U");
  const blkOf=n=>{const b=d.blocks.find(b=>new RegExp(`(^|[^0-9])${n}([^0-9]|$)`).test(b.sub||""));return b?b.title.trim():""};
  const rotOf=n=>{const b=d.blocks.find(b=>new RegExp(`(^|[^0-9])${n}([^0-9]|$)`).test(b.sub||""));const m=b&&/^Week\s+([A-Z])$/i.exec(b.title.trim());return m?m[1].toUpperCase():""};
  const struct=seqW.length>1&&d.blocks.length>1?`<div class="struct"><div class="struct-row">${seqW.map((L,i)=>{const bt=blkOf(i+1);let nm=L==="U"?"Unload":`Block ${"ABCDEFG".indexOf(L)+1}`;if(L!=="U"&&/^Block\s+[A-Z]$/i.test(bt))nm=bt;const r=rotOf(i+1);return `<div class="wkc b-${esc(L)}"><span class="n">Week ${i+1}</span><b>${esc(nm)}</b>${r?`<span class="r">Week ${esc(r)}</span>`:""}</div>`}).join("")}</div>${(()=>{const rs=seqW.map((_,i)=>rotOf(i+1));return rs.every((r,i)=>r===(i%2?"B":"A"))?`<p class="struct-note"><b>A/B weekly undulation.</b> The program alternates two different training weeks. Week A and Week B each work at their own intensities and progress over a 2-week cycle, so you get more variety and steady progress while lowering the risk of burnout and overuse.</p>`:""})()}</div>`:"";
  let single="", notesShown=howTo;
  if(d.blocks.length===1&&seqW.length>1){
    const groups=(bi.seq||"").split("/").filter(g=>g&&g!=="U"), L=groups[0].length, same=groups.every(g=>g.length===L&&new Set(g).size===1);
    if(same){
      const nums=["one","two","three","four"], rng=i=>`weeks ${i*L+1}–${i*L+L}`;
      const list=groups.map((g,i)=>`Block ${i+1} in ${rng(i)}`), lst=list.length>1?list.slice(0,-1).join(", ")+" and "+list[list.length-1]:list[0];
      const how=L===2?"Each block repeats its loads for two weeks so you can settle in, then the next block raises the intensity.":`Loads build week to week inside each block, and each new block moves to heavier work.`;
      single=`<p class="struct-note"><b>${esc(groups.join("/"))} block pattern.</b> The program runs ${nums[groups.length-1]||groups.length} ${L}-week blocks: ${lst}. The exercises stay the same throughout. ${how}</p>`;
      notesShown=howTo.filter(n=>!/^The same exercises run (all six weeks|every week)\.?$/.test(n.trim())&&!/^Weeks 1–2 Hypertrophy/.test(n.trim()));
      notesShown=notesShown.map(n=>n.replace("the first week of each rotation is shown","Week 1 is shown"));
    }
  }
  if(!d.progressions.length)notesShown=notesShown.map(n=>n.replace(/\s*See progression\.?/,""));
  if(howTo.length||struct||single)html+=`<details class="howto"><summary>How to read this program</summary>${struct}${single}<ul class="notes">${notesShown.map(n=>`<li>${esc(n)}</li>`).join("")}</ul></details>`;
  d.blocks.forEach(b=>{
    const hasCond=b.days.some(([,c])=>c&&c!=="—");
    const tm=(info.sessionTimes||{})[b.title.trim().replace(/^(WEEK|BLOCK)/i,"Week")]||[];
    const tmOf=num=>{const t=tm[parseInt(num,10)-1];return t?`<em class="tm">${esc(t)} min</em>`:""};
    const seq=b.days.map(([label,,ex])=>{const [num,...rest]=label.split(" ");return `<li${!ex.length?' class="cardio"':""}><span>Day ${esc(num)}</span>${esc(rest.join(" ")).replace(/\//g,"/<wbr>")}${tmOf(num)}</li>`}).join("");
    html+=`<section class="block${hasCond?"":" nocond"}"><details class="wk"><summary><h2>${esc(b.title)}<small>${esc(b.sub)}</small></h2><ol class="seq">${seq}</ol><span class="wk-tog"></span></summary><div class="tbl-wrap"><table><thead><tr><th>Day</th><th></th><th>Lift</th><th>Prescription</th>${hasCond?"<th>Conditioning</th>":""}</tr></thead><tbody>`;
    b.days.forEach(([label,cond,ex])=>{
      const [num,...rest]=label.split(" ");
      const dayCell=`<td class="day" rowspan="${Math.max(ex.length,1)}"><span>Day ${num}</span>${esc(rest.join(" "))}${tmOf(num)}</td>`;
      if(!ex.length){html+=`<tr class="day-start cardio">${dayCell}<td class="slot"></td><td>—</td><td class="rx">—</td>${hasCond?`<td class="cond">${esc(cond)}</td>`:""}</tr>`;return}
      ex.forEach(([slot,lift,rx],i)=>{
        const letter=slot[0], paired=ex.some(e=>e[0]===letter+"2");
        const cls=[i===0?"day-start":"",paired?(slot.endsWith("1")?"pair-a":"pair-b"):"solo"].join(" ");
        html+=`<tr class="${cls}">${i===0?dayCell:""}<td class="slot">${esc(slot)}</td><td>${liftName(lift)}</td><td class="rx">${esc(rx)}</td>${i===0&&hasCond?`<td class="cond" rowspan="${ex.length}">${cond?esc(cond):"—"}</td>`:""}</tr>`;
      });
    });
    html+=`</tbody></table></div></details></section>`;
  });
  if(d.progressions.length)html+=`<details class="progwrap"><summary>Week-to-week progression</summary>`;
  d.progressions.forEach(pr=>{
    html+=`<section class="block prog"><h2>${esc(pr.title)}</h2><div class="tbl-wrap"><table><thead><tr>${pr.cols.map(c=>`<th>${esc(c)}</th>`).join("")}</tr></thead><tbody>${pr.rows.map(r=>`<tr>${r.map(c=>`<td>${esc(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div></section>`;
  });
  if(d.progressions.length)html+=`</details>`;
  html+=upgradeBox();
  if(html.includes("No sets saved"))html+=`<p class="foot">"No sets saved" means that lift has no sets entered yet.</p>`;
  app.innerHTML=html; toTop();
}
function renderBundle(b){

  if(!bundleLive(b)){
  app.innerHTML=`${siteNav()}<div class="p-hero"><div class="p-main"><a class="back" href="#go-bundles">← All bundles</a><div class="pills"><span class="pill-d">Program Bundle</span><span class="pill-o">Coming soon</span></div><h1${h1Long(b.name)}>${esc(b.name)}</h1><div class="about">${paras}</div><p class="builtfor"><b>Who it's for:</b> ${esc(b.who)}</p></div>
  <aside class="buycard" aria-label="Bundle status"><span class="pill soon">Coming soon</span><span class="price" style="font-size:2rem">Price to come</span><dl><div><dt>Programs</dt><dd>Being finalized</dd></div><div><dt>Run order</dt><dd>Listed at launch</dd></div></dl><span class="buy nolink" title="Coming soon">Coming soon</span></aside></div>
  <div class="pending"><b>What's inside:</b> the programs in this bundle are being finalized and will be listed here with the run order and price.${DEMO_HREF?` Want something now? <a href="${esc(DEMO_HREF)}" target="_blank" rel="noopener">Get a free 2-week custom program</a>.`:""}</div>${upgradeBox()}`;
  toTop(); return;
  }
  const ps=b.programs.map(i=>PROGRAMS.find(p=>p[1]===i)).filter(Boolean);
  const each=parseFloat((window.PROGRAM_PRICE||"$50").replace(/[^0-9.]/g,""))||50, sep=each*ps.length, bp=parseFloat(b.price.replace(/[^0-9.]/g,""))||0;
  const save=sep>bp&&bp?`$${Math.round(sep-bp)}`:"";
  const weeks=ps.reduce((a,p)=>a+p[2],0);
  const rows=ps.map((p,k)=>`<div class="row extra-row"><a class="main" href="#${esc(p[1])}"><div class="name">${k+1}. ${esc(p[0])}</div>${summaryOf(p[1])?`<div class="sub">${esc(summaryOf(p[1]))}</div>`:""}<div class="meta"><span class="tag">${p[2]} weeks</span><span class="tag">${p[3]} days/week</span>${levelOf(p[1])?`<span class="tag">${esc(levelOf(p[1]))}</span>`:""}</div></a><div class="acts"><a class="see" href="#${esc(p[1])}">See program</a></div></div>`).join("");
  app.innerHTML=`${siteNav()}<div class="p-hero"><div class="p-main"><a class="back" href="#go-bundles">← All bundles</a><div class="pills"><span class="pill-d">Program Bundle</span><span class="pill-o">${ps.length} programs</span></div><h1${h1Long(b.name)}>${esc(b.name)}</h1><div class="about">${paras}</div><p class="builtfor"><b>Who it's for:</b> ${esc(b.who)}</p></div>
  <aside class="buycard" aria-label="Buy this bundle"><span class="pill">Program bundle</span><span class="price">${esc(b.price)}<small> one-time</small></span><dl><div><dt>Programs</dt><dd>${ps.length}</dd></div><div><dt>Total length</dt><dd>${weeks} weeks</dd></div><div><dt>Bought separately</dt><dd>$${sep}</dd></div>${save?`<div><dt>You save</dt><dd>${save}</dd></div>`:""}</dl><a class="buy" href="${esc(b.link)}" target="_blank" rel="noopener">Buy Bundle – ${esc(b.price)}</a></aside></div>
  <section class="panel" aria-label="Programs in this bundle"><div class="panel-head"><b>What's inside</b><span>${ps.length} programs · tap any program for the full breakdown</span></div>${rows}</section>${upgradeBox()}`;
  toTop();
}
function renderSystem(x){
  const paras=t=>String(t||"").trim().split(/\n\s*\n/).map(p=>`<p>${esc(p.trim())}</p>`).join("");
  const ps=x.phases.map(i=>PROGRAMS.find(p=>p[1]===i)).filter(Boolean);
  const each=parseFloat((window.PROGRAM_PRICE||"$50").replace(/[^0-9.]/g,""))||50, sep=each*ps.length, bp=parseFloat(x.price.replace(/[^0-9.]/g,""))||0;
  const save=sep>bp&&bp?`$${Math.round(sep-bp)}`:"";
  const weeks=ps.reduce((a,p)=>a+p[2],0), days=[...new Set(ps.map(p=>p[3]))].join("–");
  const mins=ps.flatMap(p=>Object.values((INFO[p[1]]||{}).sessionTimes||{}).flat()).flatMap(t=>String(t).split(/[–-]/).map(Number)).filter(n=>n>0);
  const sess=mins.length?`${Math.min(...mins)}–${Math.max(...mins)} min`:"";
  const buyBtn=(cls="")=>`<a class="buy${cls}" href="${esc(x.link)}" target="_blank" rel="noopener">Buy System – ${esc(x.price)}</a>`;
  const phaseCards=ps.map((p,k)=>{const n=(x.phaseNotes||{})[p[1]]||{};return `<a class="sys-phase" href="#${esc(p[1])}"><span class="n">0${k+1}</span><span class="lbl">Phase ${k+1}${n.label?" · "+esc(n.label):""}</span><h3>${esc(p[0])}</h3><p>${esc(n.body||summaryOf(p[1]))}</p>${(n.lifts||[]).length?`<div class="lifts">${n.lifts.map(l=>`<span class="tag">${esc(l)}</span>`).join("")}</div>`:""}<div class="meta"><span class="tag seq">${p[2]} weeks</span> <span class="tag seq">${p[3]} days/week</span></div><span class="go">See the full Phase ${k+1} program</span></a>`}).join("");
  const travel=x.travel?(()=>{const tp=(x.travel.programs||[]).map(i=>PROGRAMS.find(p=>p[1]===i)).filter(Boolean);return `<section class="sys-sec" aria-label="${esc(x.travel.title)}"><span class="eb">Training on the road</span><h2>${esc(x.travel.title)}</h2><div class="txt"><p>${esc(x.travel.body)}</p></div><div class="panel" style="margin-top:20px;background:var(--bg)">${tp.map(p=>`<div class="row extra-row"><a class="main" href="#${esc(p[1])}"><div class="name">${esc(p[0])}</div><div class="sub">${esc(summaryOf(p[1]))}</div><div class="meta"><span class="tag">${p[2]} weeks</span><span class="tag">${p[3]} days/week</span><span class="tag">Sold separately</span></div></a><div class="acts"><a class="see" href="#${esc(p[1])}">See program</a></div></div>`).join("")}</div></section>`})():"";
  app.innerHTML=`${siteNav()}<div class="p-hero"><div class="p-main"><a class="back" href="#go-systems">← All systems</a><div class="pills"><span class="pill-d">Total Training System</span><span class="pill-o">${ps.length} phases</span><span class="pill-o">Repeatable</span></div><h1${h1Long(x.name)}>${esc(x.name)}</h1><div class="about sys-about"><p>${esc(x.headline)}</p>${paras(x.intro)}</div><p class="builtfor"><b>Who it's for:</b> ${esc(x.who)}</p></div>
  <aside class="buycard" aria-label="Buy this system"><span class="pill">Total training system</span><span class="price">${esc(x.price)}<small> one-time</small></span><dl><div><dt>Phases</dt><dd>${ps.length}, run in order</dd></div><div><dt>One cycle</dt><dd>${weeks} weeks</dd></div><div><dt>Schedule</dt><dd>${days} days / week</dd></div>${sess?`<div><dt>Sessions</dt><dd>${sess}</dd></div>`:""}<div><dt>Bought separately</dt><dd>$${sep}</dd></div>${save?`<div><dt>You save</dt><dd>${save}</dd></div>`:""}<div><dt>Repeats</dt><dd>Unlimited</dd></div></dl>${buyBtn()}</aside></div>
  ${x.problem?`<section class="sys-band"><span class="eb">Why a system</span><h2>${esc(x.problem.title)}</h2><div class="txt">${paras(x.problem.body)}</div></section>`:""}
  ${(x.week||[]).length?`<section class="sys-sec" aria-label="The weekly layout"><span class="eb">Every ${esc(x.name.replace(/ (Training )?System$/i,""))} week</span><h2>Six days. Same rhythm every phase.</h2><ul class="sys-week">${x.week.map(([d,b,w])=>`<li class="${/condition|cardio/i.test(b)?"cond":""}"><span class="d">${esc(d)}</span><b>${esc(b)}</b><span class="w">${esc(w)}</span></li>`).join("")}</ul>${x.weekNote?`<p class="note">${esc(x.weekNote)}</p>`:""}</section>`:""}
  <section class="sys-sec" aria-label="The phases"><span class="eb">${ps.length} phases · ${weeks} weeks per cycle</span><h2>${["One","Two","Three","Four","Five","Six"][ps.length-1]||ps.length} phases. One progression.</h2><div class="sys-phases">${phaseCards}</div></section>
  ${x.loop?`<section class="sys-band" aria-label="${esc(x.loop.title)}"><span class="eb">Train on it indefinitely</span><h2>${esc(x.loop.title)}</h2><div class="sys-loop" aria-hidden="true">${(x.loop.steps||[]).map((t,i,a)=>`<span class="st${i===a.length-1?" new":""}">${esc(t)}</span>${i<a.length-1?'<span class="ar">→</span>':""}`).join("")}<span class="ret">↻ Then back to Phase 1 for your next cycle</span></div><div class="txt">${paras(x.loop.body)}</div></section>`:""}
  ${(x.constant||x.changes)?`<section class="sys-sec" aria-label="What stays and what changes"><span class="eb">Built to repeat</span><h2>What stays the same. What moves.</h2><div class="sys-two"><div><h3>Stays the same</h3><ul>${(x.constant||[]).map(t=>`<li>${esc(t)}</li>`).join("")}</ul></div><div class="chg"><h3>Moves forward</h3><ul>${(x.changes||[]).map(t=>`<li>${esc(t)}</li>`).join("")}</ul></div></div></section>`:""}
  ${travel}
  ${(x.includes||[]).length?`<section class="sys-sec" aria-label="What you get"><span class="eb">What you get</span><h2>Everything to run it, again and again.</h2><div class="sys-inc">${x.includes.map(([t,d])=>`<div><b>${esc(t)}</b><p>${esc(d)}</p></div>`).join("")}</div></section>`:""}
  ${(x.faq||[]).length?`<section class="sys-sec" aria-label="Questions"><span class="eb">Questions</span><h2>Before you start.</h2><div class="sys-faq">${x.faq.map(([q,a])=>`<details><summary>${esc(q)}</summary><p>${esc(a)}</p></details>`).join("")}</div></section>`:""}
  <section class="sys-band" aria-label="Buy"><span class="eb">${esc(x.name)}</span><h2>One purchase. A system you keep.</h2><div class="sys-cta"><span class="price">${esc(x.price)}<small> one-time · ${ps.length} phases · repeat as often as you like</small></span>${buyBtn()}</div></section>${upgradeBox()}`;
  toTop();
}
function route(){const id=location.hash.slice(1);
  postUp({axiosLibRoute:id.startsWith("go-")?"":id}); /* lets the host page put the open program in its own URL for sharing */
  if(id.startsWith("go-")){const k=id.slice(3);if(k==="bundles"||k==="systems")activeExtra=k;renderList();const t=document.getElementById({programs:"lib-programs",bundles:"lib-extras",systems:"lib-extras",club:"club"}[k]);if(t)requestAnimationFrame(()=>t.scrollIntoView({block:"start"}));return}
  const b=id.startsWith("bundle-")&&(window.BUNDLES||[]).find(x=>"bundle-"+x.id===id);
  const sy=id.startsWith("system-")&&(window.SYSTEMS||[]).find(x=>"system-"+x.id===id&&systemLive(x));
  b?renderBundle(b):sy?renderSystem(sy):id?renderDetail(id):renderList()}
window.addEventListener("hashchange",route);
route();
</script>
